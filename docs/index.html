document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

);\n  unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116;\n}\n/* greek */\n@font-face {\n  font-family: 'JetBrains Mono';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"dfa57b9d-9a22-43ab-8759-fa9af5e8c556\") format('woff2');\n  unicode-range: U+0370-0377, U+037A-037F, U+0384-038A, U+038C, U+038E-03A1, U+03A3-03FF;\n}\n/* vietnamese */\n@font-face {\n  font-family: 'JetBrains Mono';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"bed03b37-08a2-4872-be66-ba74d7062bed\") format('woff2');\n  unicode-range: U+0102-0103, U+0110-0111, U+0128-0129, U+0168-0169, U+01A0-01A1, U+01AF-01B0, U+0300-0301, U+0303-0304, U+0308-0309, U+0323, U+0329, U+1EA0-1EF9, U+20AB;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'JetBrains Mono';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"b43608ce-9504-4639-a635-83972a246b63\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'JetBrains Mono';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"60b0ab7c-08e0-496b-a1a1-5726ddd963dd\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n<\u002Fstyle>\n<style>/* ============================================================\n   Hares AI — Landing page styles\n   Clean, trustworthy enterprise SaaS · light · emerald accent\n   ============================================================ */\n\n:root {\n  /* Surfaces */\n  --bg: #fbfbfd;\n  --bg-soft: #f4f6f9;\n  --surface: #ffffff;\n  --surface-2: #fafbfc;\n\n  /* Ink */\n  --ink: #0e1726;\n  --ink-2: #36404f;\n  --muted: #69737f;\n  --faint: #99a2ae;\n\n  /* Lines */\n  --line: #e7eaf0;\n  --line-2: #eef1f5;\n  --line-strong: #d9dee6;\n\n  /* Accent — secure emerald */\n  --accent: #00b877;\n  --accent-600: #009463;\n  --accent-700: #007a52;\n  --accent-glow: #00e08a;\n  --accent-050: #e9f8f1;\n  --accent-100: #d2f1e3;\n\n  /* Risk semantics */\n  --high: #e5484d;\n  --high-bg: #fdecec;\n  --high-line: #f6cccd;\n  --med: #d9820a;\n  --med-bg: #fdf3e3;\n  --med-line: #f4ddb6;\n  --low: #3b76f6;\n  --low-bg: #eaf0fe;\n  --low-line: #cdddfb;\n  --none: var(--accent-600);\n  --none-bg: var(--accent-050);\n  --none-line: var(--accent-100);\n\n  /* Shadows (cool, soft) */\n  --shadow-xs: 0 1px 2px rgba(14, 23, 38, 0.05);\n  --shadow-sm: 0 2px 8px rgba(14, 23, 38, 0.06);\n  --shadow: 0 8px 24px rgba(14, 23, 38, 0.08);\n  --shadow-lg: 0 24px 60px -16px rgba(14, 23, 38, 0.18);\n  --shadow-accent: 0 16px 40px -12px rgba(0, 184, 119, 0.35);\n\n  /* Radii */\n  --r-xs: 8px;\n  --r-sm: 12px;\n  --r: 16px;\n  --r-lg: 22px;\n  --r-xl: 30px;\n  --pill: 999px;\n\n  /* Type */\n  --sans: \"Hanken Grotesk\", -apple-system, BlinkMacSystemFont, sans-serif;\n  --mono: \"JetBrains Mono\", ui-monospace, \"SF Mono\", Menlo, monospace;\n\n  --maxw: 1180px;\n}\n\n* { box-sizing: border-box; }\n\nhtml { scroll-behavior: smooth; }\n\nbody {\n  margin: 0;\n  font-family: var(--sans);\n  background: var(--bg);\n  color: var(--ink);\n  font-size: 17px;\n  line-height: 1.6;\n  -webkit-font-smoothing: antialiased;\n  text-rendering: optimizeLegibility;\n  overflow-x: hidden;\n}\n\nh1, h2, h3, h4 {\n  margin: 0;\n  font-weight: 800;\n  letter-spacing: -0.022em;\n  line-height: 1.08;\n  text-wrap: balance;\n}\n\np { margin: 0; text-wrap: pretty; }\na { color: inherit; text-decoration: none; }\n\n::selection { background: var(--accent-100); color: var(--accent-700); }\n\n.mono { font-family: var(--mono); }\n\n/* ---------- Layout ---------- */\n.wrap { width: 100%; max-width: var(--maxw); margin: 0 auto; padding: 0 28px; }\n\nsection { position: relative; }\n\n.section-pad { padding: clamp(72px, 9vw, 128px) 0; }\n\n.eyebrow {\n  display: inline-flex;\n  align-items: center;\n  gap: 8px;\n  font-family: var(--mono);\n  font-size: 12px;\n  font-weight: 600;\n  letter-spacing: 0.14em;\n  text-transform: uppercase;\n  color: var(--accent-600);\n  margin-bottom: 18px;\n}\n.eyebrow::before {\n  content: \"\";\n  width: 22px; height: 1.5px;\n  background: var(--accent);\n  border-radius: 2px;\n}\n\n.section-title {\n  font-size: clamp(1.85rem, 3.4vw, 2.85rem);\n}\n.section-lead {\n  margin-top: 18px;\n  max-width: 620px;\n  color: var(--muted);\n  font-size: clamp(1.02rem, 1.4vw, 1.18rem);\n}\n.section-head { margin-bottom: clamp(40px, 5vw, 64px); }\n.section-head.center { text-align: center; }\n.section-head.center .section-lead { margin-left: auto; margin-right: auto; }\n.section-head.center .eyebrow::before { display: none; }\n\n/* ---------- Buttons ---------- */\n.btn {\n  display: inline-flex;\n  align-items: center;\n  gap: 9px;\n  font-family: var(--sans);\n  font-weight: 600;\n  font-size: 0.97rem;\n  padding: 13px 22px;\n  border-radius: var(--pill);\n  border: 1px solid transparent;\n  cursor: pointer;\n  transition: transform 0.18s ease, box-shadow 0.25s ease, background 0.2s ease, border-color 0.2s ease;\n  white-space: nowrap;\n}\n.btn i { width: 18px; height: 18px; }\n.btn-primary {\n  background: var(--ink);\n  color: #fff;\n  box-shadow: var(--shadow-sm);\n}\n.btn-primary:hover { transform: translateY(-2px); box-shadow: var(--shadow); }\n.btn-accent {\n  background: linear-gradient(180deg, var(--accent-glow), var(--accent));\n  color: #04130c;\n  box-shadow: var(--shadow-accent);\n}\n.btn-accent:hover { transform: translateY(-2px); }\n.btn-ghost {\n  background: var(--surface);\n  color: var(--ink);\n  border-color: var(--line-strong);\n  box-shadow: var(--shadow-xs);\n}\n.btn-ghost:hover { transform: translateY(-2px); border-color: var(--ink-2); }\n\n/* ---------- Pills / badges ---------- */\n.pill {\n  display: inline-flex;\n  align-items: center;\n  gap: 7px;\n  font-size: 0.8rem;\n  font-weight: 600;\n  padding: 6px 13px;\n  border-radius: var(--pill);\n  background: var(--surface);\n  border: 1px solid var(--line);\n  color: var(--ink-2);\n  box-shadow: var(--shadow-xs);\n}\n.pill i { width: 14px; height: 14px; }\n.dot { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 4px var(--accent-050); }\n\n/* ============================================================\n   NAV\n   ============================================================ */\n.nav {\n  position: sticky;\n  top: 0;\n  z-index: 100;\n  background: rgba(251, 251, 253, 0.78);\n  backdrop-filter: saturate(180%) blur(18px);\n  border-bottom: 1px solid transparent;\n  transition: border-color 0.3s ease, background 0.3s ease;\n}\n.nav.scrolled { border-color: var(--line); background: rgba(251, 251, 253, 0.9); }\n.nav-inner {\n  height: 68px;\n  display: flex;\n  align-items: center;\n  justify-content: space-between;\n  gap: 24px;\n}\n.brand { display: flex; align-items: center; gap: 11px; }\n.brand-mark {\n  width: 36px; height: 36px;\n  border-radius: 10px;\n  background: linear-gradient(150deg, var(--accent-glow), var(--accent-600));\n  display: grid; place-items: center;\n  color: #04130c;\n  box-shadow: var(--shadow-sm), inset 0 1px 0 rgba(255,255,255,0.4);\n}\n.brand-mark i { width: 20px; height: 20px; stroke-width: 2.5; }\n.brand-name { font-weight: 800; font-size: 1.12rem; letter-spacing: -0.02em; }\n.brand-name span { color: var(--accent-600); }\n\n.nav-links { display: flex; align-items: center; gap: 30px; }\n.nav-links a {\n  font-size: 0.92rem; font-weight: 500; color: var(--ink-2);\n  transition: color 0.18s ease; position: relative;\n}\n.nav-links a:hover { color: var(--ink); }\n.nav-cta { display: flex; align-items: center; gap: 12px; }\n\n@media (max-width: 880px) {\n  .nav-links { display: none; }\n}\n\n/* ============================================================\n   HERO\n   ============================================================ */\n.hero { padding: clamp(48px, 7vw, 92px) 0 clamp(60px, 7vw, 100px); overflow: hidden; }\n.hero-bg {\n  position: absolute; inset: 0; z-index: 0; pointer-events: none;\n  background:\n    radial-gradient(900px 480px at 78% -8%, rgba(0, 224, 138, 0.13), transparent 62%),\n    radial-gradient(700px 420px at 8% 6%, rgba(59, 118, 246, 0.06), transparent 60%);\n}\n.hero-grid {\n  position: absolute; inset: 0; z-index: 0; pointer-events: none;\n  background-image:\n    linear-gradient(to right, rgba(14,23,38,0.035) 1px, transparent 1px),\n    linear-gradient(to bottom, rgba(14,23,38,0.035) 1px, transparent 1px);\n  background-size: 46px 46px;\n  mask-image: radial-gradient(900px 600px at 60% 30%, #000 30%, transparent 78%);\n  -webkit-mask-image: radial-gradient(900px 600px at 60% 30%, #000 30%, transparent 78%);\n}\n.hero-inner {\n  position: relative; z-index: 1;\n  display: grid;\n  grid-template-columns: 1.02fr 1.18fr;\n  gap: clamp(32px, 5vw, 72px);\n  align-items: center;\n}\n.hero-eyebrow {\n  display: inline-flex; align-items: center; gap: 9px;\n  background: var(--surface);\n  border: 1px solid var(--line);\n  padding: 7px 7px 7px 14px;\n  border-radius: var(--pill);\n  font-size: 0.82rem; font-weight: 600; color: var(--ink-2);\n  box-shadow: var(--shadow-xs);\n  margin-bottom: 26px;\n}\n.hero-eyebrow .tag {\n  font-family: var(--mono); font-size: 0.7rem; font-weight: 600;\n  background: var(--accent-050); color: var(--accent-700);\n  padding: 3px 9px; border-radius: var(--pill); letter-spacing: 0.04em;\n}\n.hero h1 {\n  font-size: clamp(2.5rem, 5.6vw, 4.3rem);\n  letter-spacing: -0.035em;\n}\n.hero h1 .grad {\n  background: linear-gradient(95deg, var(--accent-600), var(--accent-glow));\n  -webkit-background-clip: text; background-clip: text; color: transparent;\n}\n.hero-sub {\n  margin-top: 24px;\n  font-size: clamp(1.05rem, 1.5vw, 1.26rem);\n  color: var(--muted);\n  max-width: 540px;\n}\n.hero-actions { display: flex; flex-wrap: wrap; gap: 14px; margin-top: 36px; }\n.hero-meta {\n  display: flex; flex-wrap: wrap; gap: 10px 22px; margin-top: 34px;\n  color: var(--faint); font-size: 0.86rem;\n}\n.hero-meta span { display: inline-flex; align-items: center; gap: 7px; }\n.hero-meta i { width: 15px; height: 15px; color: var(--accent-600); }\n\n@media (max-width: 980px) {\n  .hero-inner { grid-template-columns: 1fr; }\n  .hero-visual { order: -1; }\n}\n\n/* ---------- Hero demo (the signature moment) ---------- */\n.demo {\n  position: relative;\n  background: var(--surface);\n  border: 1px solid var(--line);\n  border-radius: var(--r-lg);\n  box-shadow: var(--shadow-lg);\n  overflow: hidden;\n  isolation: isolate;\n}\n.demo-top {\n  display: flex; align-items: center; gap: 10px;\n  padding: 13px 18px;\n  border-bottom: 1px solid var(--line-2);\n  background: var(--surface-2);\n}\n.traffic { display: flex; gap: 7px; }\n.traffic i { width: 11px; height: 11px; border-radius: 50%; display: block; }\n.traffic i:nth-child(1) { background: #ff5f57; }\n.traffic i:nth-child(2) { background: #febc2e; }\n.traffic i:nth-child(3) { background: #28c840; }\n.demo-url {\n  margin-left: 6px;\n  font-family: var(--mono); font-size: 0.74rem; color: var(--faint);\n  display: flex; align-items: center; gap: 6px;\n}\n.demo-url i { width: 12px; height: 12px; }\n.demo-guard {\n  margin-left: auto;\n  display: inline-flex; align-items: center; gap: 6px;\n  font-family: var(--mono); font-size: 0.68rem; font-weight: 600;\n  color: var(--accent-700);\n  background: var(--accent-050);\n  border: 1px solid var(--accent-100);\n  padding: 4px 9px; border-radius: var(--pill);\n}\n.demo-guard i { width: 12px; height: 12px; }\n.demo-guard .ping {\n  width: 6px; height: 6px; border-radius: 50%; background: var(--accent);\n  animation: ping 1.6s ease-in-out infinite;\n}\n@keyframes ping { 0%, 100% { opacity: 1; } 50% { opacity: 0.25; } }\n\n.demo-body { padding: 22px; position: relative; }\n.composer {\n  border: 1.5px solid var(--line-strong);\n  border-radius: var(--r);\n  padding: 16px 16px 14px;\n  background: var(--surface);\n  transition: border-color 0.4s ease, box-shadow 0.4s ease;\n  position: relative;\n}\n.composer.scanning { border-color: var(--accent); box-shadow: 0 0 0 4px var(--accent-050); }\n.composer.blocked { border-color: var(--high); box-shadow: 0 0 0 4px var(--high-bg); }\n\n.composer-label {\n  font-size: 0.72rem; font-weight: 600; color: var(--faint);\n  text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 10px;\n  display: flex; align-items: center; justify-content: space-between;\n}\n.prompt-text {\n  font-size: 0.98rem; line-height: 1.65; color: var(--ink-2);\n  min-height: 96px; word-break: break-word;\n}\n.prompt-text .caret {\n  display: inline-block; width: 2px; height: 1.05em;\n  background: var(--accent); vertical-align: text-bottom;\n  animation: blink 1s steps(2) infinite; margin-left: 1px;\n}\n@keyframes blink { 50% { opacity: 0; } }\n\n/* sensitive entity highlight states */\n.ent {\n  border-radius: 5px; padding: 1px 4px; font-weight: 600;\n  transition: all 0.45s ease;\n  background: var(--high-bg); color: var(--high);\n  box-shadow: inset 0 0 0 1px var(--high-line);\n}\n.ent.masked {\n  font-family: var(--mono); font-size: 0.86em;\n  background: var(--ink); color: var(--accent-glow);\n  box-shadow: none; letter-spacing: 0.01em;\n}\n\n.composer-foot {\n  display: flex; align-items: center; justify-content: space-between;\n  margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--line-2);\n}\n.composer-foot .hint { font-size: 0.76rem; color: var(--faint); display: flex; align-items: center; gap: 6px; }\n.composer-foot .hint i { width: 13px; height: 13px; }\n.send-btn {\n  display: inline-flex; align-items: center; gap: 7px;\n  font-size: 0.82rem; font-weight: 600;\n  padding: 8px 14px; border-radius: var(--pill);\n  background: var(--accent); color: #04130c; border: none;\n  transition: all 0.35s ease;\n}\n.send-btn i { width: 14px; height: 14px; }\n.send-btn.blocked { background: var(--high); color: #fff; }\n\n/* scan line sweep */\n.scanline {\n  position: absolute; left: 0; right: 0; height: 64px; top: -64px;\n  background: linear-gradient(180deg, transparent, rgba(0,224,138,0.18), transparent);\n  border-top: 1.5px solid var(--accent);\n  opacity: 0; pointer-events: none;\n}\n.scanline.run { animation: sweep 1.05s ease-in-out; }\n@keyframes sweep {\n  0% { top: -64px; opacity: 0; }\n  12% { opacity: 1; }\n  88% { opacity: 1; }\n  100% { top: 100%; opacity: 0; }\n}\n\n/* verdict panel */\n.verdict {\n  margin-top: 16px;\n  border-radius: var(--r);\n  border: 1px solid var(--high-line);\n  background: linear-gradient(180deg, #fff, var(--high-bg));\n  padding: 0 16px;\n  max-height: 0; opacity: 0; overflow: hidden;\n  transition: max-height 0.5s cubic-bezier(0.22,1,0.36,1), opacity 0.4s ease, padding 0.5s ease;\n}\n.verdict.show { max-height: 220px; opacity: 1; padding: 16px; }\n.verdict-head { display: flex; align-items: center; gap: 11px; }\n.verdict-badge {\n  display: inline-flex; align-items: center; gap: 7px;\n  font-family: var(--mono); font-size: 0.74rem; font-weight: 700; letter-spacing: 0.06em;\n  background: var(--high); color: #fff;\n  padding: 5px 11px; border-radius: var(--pill);\n}\n.verdict-badge i { width: 13px; height: 13px; }\n.verdict-title { font-weight: 700; font-size: 0.96rem; color: var(--high); }\n.verdict-desc { font-size: 0.85rem; color: var(--ink-2); margin-top: 9px; }\n.verdict-chips { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 12px; }\n.chip {\n  font-family: var(--mono); font-size: 0.72rem; font-weight: 600;\n  background: #fff; border: 1px solid var(--high-line); color: var(--high);\n  padding: 4px 9px; border-radius: var(--pill);\n  display: inline-flex; align-items: center; gap: 5px;\n}\n.chip i { width: 12px; height: 12px; }\n.verdict-action {\n  margin-top: 13px; padding-top: 12px; border-top: 1px dashed var(--high-line);\n  display: flex; align-items: center; gap: 8px; font-size: 0.82rem; color: var(--accent-700); font-weight: 600;\n}\n.verdict-action i { width: 15px; height: 15px; }\n\n/* floating annotations */\n.demo-note {\n  position: absolute; z-index: 3;\n  background: var(--ink); color: #fff;\n  font-family: var(--mono); font-size: 0.68rem; font-weight: 500;\n  padding: 7px 11px; border-radius: var(--pill);\n  box-shadow: var(--shadow);\n  display: flex; align-items: center; gap: 6px;\n  opacity: 0; transform: translateY(6px) scale(0.96);\n  transition: all 0.45s cubic-bezier(0.22,1,0.36,1);\n}\n.demo-note.show { opacity: 1; transform: translateY(0) scale(1); }\n.demo-note i { width: 12px; height: 12px; color: var(--accent-glow); }\n.demo-note.n1 { top: 64px; right: -10px; }\n.demo-note.n2 { bottom: 96px; left: -14px; }\n\n@media (max-width: 600px) {\n  .demo-note { display: none; }\n}\n\n/* ============================================================\n   MARQUEE / trust strip\n   ============================================================ */\n.strip { border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); background: var(--surface); }\n.strip-inner { padding: 26px 0; display: flex; align-items: center; gap: 40px; flex-wrap: wrap; justify-content: center; }\n.strip-label { font-size: 0.78rem; font-weight: 600; color: var(--faint); text-transform: uppercase; letter-spacing: 0.12em; }\n.strip-logos { display: flex; align-items: center; gap: 34px; flex-wrap: wrap; justify-content: center; }\n.strip-logo { display: flex; align-items: center; gap: 9px; font-weight: 700; font-size: 1.05rem; color: var(--ink-2); }\n.strip-logo i { width: 20px; height: 20px; color: var(--muted); }\n\n/* ============================================================\n   STATS\n   ============================================================ */\n.stats-grid {\n  display: grid; grid-template-columns: repeat(4, 1fr); gap: 18px;\n}\n.stat {\n  background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg);\n  padding: 30px 26px; box-shadow: var(--shadow-xs);\n  transition: transform 0.25s ease, box-shadow 0.25s ease;\n}\n.stat:hover { transform: translateY(-4px); box-shadow: var(--shadow); }\n.stat-num { font-size: clamp(2.1rem, 3.4vw, 2.9rem); font-weight: 800; letter-spacing: -0.03em; }\n.stat-num .u { color: var(--accent-600); }\n.stat-label { margin-top: 8px; color: var(--muted); font-size: 0.92rem; }\n@media (max-width: 820px) { .stats-grid { grid-template-columns: repeat(2, 1fr); } }\n\n/* ============================================================\n   PROBLEM\n   ============================================================ */\n.problem { background: var(--ink); color: #fff; }\n.problem .eyebrow { color: var(--accent-glow); }\n.problem .eyebrow::before { background: var(--accent-glow); }\n.problem-grid { display: grid; grid-template-columns: 1.1fr 1fr; gap: clamp(40px, 6vw, 90px); align-items: center; }\n.problem h2 { font-size: clamp(1.9rem, 3.6vw, 3rem); }\n.problem h2 .hi { color: var(--accent-glow); }\n.problem-lead { margin-top: 22px; color: rgba(255,255,255,0.72); font-size: 1.12rem; }\n.problem-lead strong { color: #fff; }\n.problem-call {\n  margin-top: 28px; padding: 20px 22px; border-radius: var(--r);\n  background: rgba(0,224,138,0.08); border: 1px solid rgba(0,224,138,0.22);\n  font-size: 1.08rem; font-weight: 600; display: flex; gap: 13px; align-items: flex-start;\n}\n.problem-call i { width: 22px; height: 22px; color: var(--accent-glow); flex-shrink: 0; margin-top: 2px; }\n.leak-card {\n  background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.1);\n  border-radius: var(--r-lg); padding: 24px; backdrop-filter: blur(8px);\n}\n.leak-row {\n  display: flex; align-items: center; gap: 13px; padding: 13px 0;\n  border-bottom: 1px solid rgba(255,255,255,0.07); font-size: 0.95rem;\n}\n.leak-row:last-child { border-bottom: none; }\n.leak-ic { width: 34px; height: 34px; border-radius: 9px; display: grid; place-items: center; flex-shrink: 0; }\n.leak-ic i { width: 17px; height: 17px; }\n.leak-ic.red { background: rgba(229,72,77,0.16); color: #ff7a7e; }\n.leak-row .lk-name { font-weight: 600; }\n.leak-row .lk-tag { margin-left: auto; font-family: var(--mono); font-size: 0.72rem; color: var(--accent-glow); background: rgba(0,224,138,0.1); padding: 4px 9px; border-radius: var(--pill); }\n@media (max-width: 880px) { .problem-grid { grid-template-columns: 1fr; } }\n\n/* ============================================================\n   HOW IT WORKS — flow\n   ============================================================ */\n.flow { display: grid; grid-template-columns: repeat(12, 1fr); gap: 18px; }\n.flow-step {\n  position: relative;\n  background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg);\n  padding: 26px; box-shadow: var(--shadow-xs);\n}\n.flow-step .num {\n  font-family: var(--mono); font-size: 0.72rem; font-weight: 700; color: var(--accent-600);\n  background: var(--accent-050); border: 1px solid var(--accent-100);\n  width: 30px; height: 30px; border-radius: 9px; display: grid; place-items: center; margin-bottom: 16px;\n}\n.flow-step .fic { width: 30px; height: 30px; color: var(--accent-600); margin-bottom: 14px; }\n.flow-step h3 { font-size: 1.12rem; margin-bottom: 9px; }\n.flow-step p { color: var(--muted); font-size: 0.92rem; }\n.flow-step .meta { margin-top: 14px; display: inline-flex; align-items: center; gap: 6px; font-family: var(--mono); font-size: 0.72rem; font-weight: 600; color: var(--accent-700); }\n.flow-step .meta i { width: 13px; height: 13px; }\n.span-3 { grid-column: span 3; }\n.span-4 { grid-column: span 4; }\n.span-6 { grid-column: span 6; }\n.span-12 { grid-column: span 12; }\n.flow-arrow { display: grid; place-items: center; color: var(--line-strong); grid-column: span 12; }\n.flow-arrow i { width: 26px; height: 26px; }\n\n.flow-decision {\n  grid-column: span 12;\n  background: linear-gradient(180deg, var(--surface), var(--surface-2));\n  border: 1px solid var(--line); border-radius: var(--r-lg); padding: 28px;\n}\n.flow-decision h3 { font-size: 1.2rem; margin-bottom: 4px; display: flex; align-items: center; gap: 10px; }\n.flow-decision h3 i { width: 22px; height: 22px; color: var(--accent-600); }\n.decision-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-top: 20px; }\n@media (max-width: 760px) {\n  .span-3, .span-4, .span-6 { grid-column: span 12; }\n  .decision-row { grid-template-columns: repeat(2, 1fr); }\n}\n\n/* ============================================================\n   RISK LEVELS\n   ============================================================ */\n.risk-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 18px; }\n.risk-card {\n  position: relative; overflow: hidden;\n  background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg);\n  padding: 26px 24px; box-shadow: var(--shadow-xs);\n  transition: transform 0.28s cubic-bezier(0.22,1,0.36,1), box-shadow 0.28s ease, border-color 0.28s ease;\n}\n.risk-card::before {\n  content: \"\"; position: absolute; left: 0; top: 0; bottom: 0; width: 4px;\n  background: var(--rc); transition: width 0.28s ease;\n}\n.risk-card:hover { transform: translateY(-6px); box-shadow: var(--shadow); border-color: var(--rc-line); }\n.risk-card:hover::before { width: 6px; }\n.risk-card.high { --rc: var(--high); --rc-bg: var(--high-bg); --rc-line: var(--high-line); }\n.risk-card.med { --rc: var(--med); --rc-bg: var(--med-bg); --rc-line: var(--med-line); }\n.risk-card.low { --rc: var(--low); --rc-bg: var(--low-bg); --rc-line: var(--low-line); }\n.risk-card.none { --rc: var(--accent-600); --rc-bg: var(--accent-050); --rc-line: var(--accent-100); }\n.risk-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 18px; }\n.risk-level { font-family: var(--mono); font-weight: 700; font-size: 0.78rem; letter-spacing: 0.08em; color: var(--rc); display: flex; align-items: center; gap: 8px; }\n.risk-level .ic { width: 30px; height: 30px; border-radius: 9px; background: var(--rc-bg); display: grid; place-items: center; }\n.risk-level .ic i { width: 16px; height: 16px; color: var(--rc); }\n.risk-action {\n  font-size: 0.72rem; font-weight: 700; font-family: var(--mono);\n  padding: 5px 10px; border-radius: var(--pill); background: var(--rc-bg); color: var(--rc); letter-spacing: 0.04em;\n}\n.risk-card h3 { font-size: 1.05rem; margin-bottom: 10px; }\n.risk-ents { color: var(--muted); font-size: 0.9rem; line-height: 1.55; }\n.risk-note { margin-top: 16px; padding-top: 14px; border-top: 1px solid var(--line-2); font-size: 0.82rem; color: var(--faint); }\n@media (max-width: 920px) { .risk-grid { grid-template-columns: repeat(2, 1fr); } }\n@media (max-width: 520px) { .risk-grid { grid-template-columns: 1fr; } }\n\n/* ============================================================\n   FEATURES\n   ============================================================ */\n.feat-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 18px; }\n.feat {\n  background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg);\n  padding: 28px 24px; box-shadow: var(--shadow-xs);\n  transition: transform 0.25s ease, box-shadow 0.25s ease, border-color 0.25s ease;\n}\n.feat:hover { transform: translateY(-5px); box-shadow: var(--shadow); border-color: var(--accent-100); }\n.feat-ic {\n  width: 48px; height: 48px; border-radius: 13px;\n  background: linear-gradient(160deg, var(--accent-050), #fff);\n  border: 1px solid var(--accent-100);\n  display: grid; place-items: center; margin-bottom: 20px;\n}\n.feat-ic i { width: 23px; height: 23px; color: var(--accent-600); stroke-width: 2; }\n.feat h3 { font-size: 1.06rem; margin-bottom: 9px; }\n.feat p { color: var(--muted); font-size: 0.91rem; }\n@media (max-width: 980px) { .feat-grid { grid-template-columns: repeat(2, 1fr); } }\n@media (max-width: 560px) { .feat-grid { grid-template-columns: 1fr; } }\n\n/* ============================================================\n   PLATFORMS\n   ============================================================ */\n.plat-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 16px; }\n.plat {\n  background: var(--surface); border: 1px solid var(--line); border-radius: var(--r);\n  padding: 24px 20px; text-align: center; box-shadow: var(--shadow-xs);\n  transition: transform 0.25s ease, box-shadow 0.25s ease;\n}\n.plat:hover { transform: translateY(-4px); box-shadow: var(--shadow-sm); }\n.plat-ic { width: 46px; height: 46px; margin: 0 auto 14px; border-radius: 13px; background: var(--bg-soft); display: grid; place-items: center; }\n.plat-ic i { width: 24px; height: 24px; color: var(--ink-2); }\n.plat h4 { font-size: 0.98rem; margin-bottom: 10px; }\n.plat .status { font-family: var(--mono); font-size: 0.7rem; font-weight: 600; padding: 4px 10px; border-radius: var(--pill); display: inline-flex; align-items: center; gap: 5px; }\n.plat .status i { width: 12px; height: 12px; }\n.plat .status.live { background: var(--accent-050); color: var(--accent-700); }\n.plat .status.soon { background: var(--bg-soft); color: var(--faint); }\n@media (max-width: 880px) { .plat-grid { grid-template-columns: repeat(3, 1fr); } }\n@media (max-width: 520px) { .plat-grid { grid-template-columns: repeat(2, 1fr); } }\n\n/* ============================================================\n   ARCHITECTURE\n   ============================================================ */\n.arch { background: var(--bg-soft); }\n.arch-stack { display: flex; flex-direction: column; gap: 16px; max-width: 860px; margin: 0 auto; }\n.arch-layer {\n  background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg);\n  padding: 24px 28px; box-shadow: var(--shadow-xs); position: relative;\n  display: grid; grid-template-columns: 200px 1fr; gap: 24px; align-items: center;\n}\n.arch-layer .lname { display: flex; align-items: center; gap: 13px; }\n.arch-layer .lname .ic { width: 42px; height: 42px; border-radius: 11px; background: var(--accent-050); border: 1px solid var(--accent-100); display: grid; place-items: center; flex-shrink: 0; }\n.arch-layer .lname .ic i { width: 20px; height: 20px; color: var(--accent-600); }\n.arch-layer .lname h4 { font-size: 1.02rem; }\n.arch-layer .lname .lnum { font-family: var(--mono); font-size: 0.7rem; color: var(--faint); }\n.arch-mods { display: flex; flex-wrap: wrap; gap: 10px; }\n.arch-mod { font-size: 0.84rem; font-weight: 500; color: var(--ink-2); background: var(--bg-soft); border: 1px solid var(--line); padding: 7px 13px; border-radius: var(--pill); }\n.arch-conn { display: grid; place-items: center; color: var(--accent); height: 4px; }\n.arch-conn i { width: 20px; height: 20px; }\n@media (max-width: 680px) { .arch-layer { grid-template-columns: 1fr; gap: 16px; } }\n\n/* ============================================================\n   SECURITY\n   ============================================================ */\n.sec-grid { display: grid; grid-template-columns: 1fr 1.15fr; gap: clamp(36px, 5vw, 70px); align-items: start; }\n.sec-quote {\n  background: var(--ink); color: #fff; border-radius: var(--r-xl); padding: 40px;\n  box-shadow: var(--shadow-lg); position: sticky; top: 96px;\n}\n.sec-quote .lock { width: 56px; height: 56px; border-radius: 15px; background: rgba(0,224,138,0.14); display: grid; place-items: center; margin-bottom: 24px; }\n.sec-quote .lock i { width: 28px; height: 28px; color: var(--accent-glow); }\n.sec-quote blockquote { font-size: 1.45rem; font-weight: 700; letter-spacing: -0.02em; line-height: 1.3; margin: 0; }\n.sec-quote .src { margin-top: 22px; font-family: var(--mono); font-size: 0.78rem; color: rgba(255,255,255,0.5); }\n.sec-list { display: flex; flex-direction: column; gap: 4px; }\n.sec-item { display: flex; gap: 15px; padding: 18px 4px; border-bottom: Fspan>\n              <span class=\"mono\" style=\"color:var(--faint);font-size:0.66rem;\">on-device scan<\u002Fspan>\n            <\u002Fdiv>\n            <div class=\"prompt-text\" id=\"promptText\"><span class=\"caret\"><\u002Fspan><\u002Fdiv>\n            <div class=\"composer-foot\">\n              <span class=\"hint\"><i data-lucide=\"shield\"><\u002Fi> Protected by Hares AI<\u002Fspan>\n              <button class=\"send-btn\" id=\"sendBtn\"><span id=\"sendLabel\">Send<\u002Fspan> <i data-lucide=\"arrow-up\"><\u002Fi><\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <div class=\"verdict\" id=\"verdict\">\n            <div class=\"verdict-head\">\n              <span class=\"verdict-badge\"><i data-lucide=\"octagon-x\"><\u002Fi> HIGH RISK<\u002Fspan>\n              <span class=\"verdict-title\">Submission blocked<\u002Fspan>\n            <\u002Fdiv>\n            <p class=\"verdict-desc\">3 sensitive entities detected and masked. This prompt cannot be sent.<\u002Fp>\n            <div class=\"verdict-chips\">\n              <span class=\"chip\"><i data-lucide=\"landmark\"><\u002Fi> IBAN<\u002Fspan>\n              <span class=\"chip\"><i data-lucide=\"id-card\"><\u002Fi> National ID<\u002Fspan>\n              <span class=\"chip\"><i data-lucide=\"key-round\"><\u002Fi> API Key<\u002Fspan>\n            <\u002Fdiv>\n            <div class=\"verdict-action\"><i data-lucide=\"wand-sparkles\"><\u002Fi> Safe AI rewrite available — resubmit without the secrets<\u002Fdiv>\n          <\u002Fdiv>\n\n          <div class=\"demo-note n1\" id=\"note1\"><i data-lucide=\"zap\"><\u002Fi> Scanned locally · 200+ patterns<\u002Fdiv>\n          <div class=\"demo-note n2\" id=\"note2\"><i data-lucide=\"eye-off\"><\u002Fi> Only masked text would be sent<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fheader>\n\n<!-- ===================== TRUST STRIP ===================== -->\n<div class=\"strip\">\n  <div class=\"wrap strip-inner\">\n    <span class=\"strip-label\">Protects prompts on<\u002Fspan>\n    <div class=\"strip-logos\">\n      <span class=\"strip-logo\"><i data-lucide=\"message-square\"><\u002Fi> ChatGPT<\u002Fspan>\n      <span class=\"strip-logo\"><i data-lucide=\"sparkles\"><\u002Fi> Gemini<\u002Fspan>\n      <span class=\"strip-logo\"><i data-lucide=\"bot\"><\u002Fi> Claude<\u002Fspan>\n      <span class=\"strip-logo\" style=\"opacity:0.5\"><i data-lucide=\"plus\"><\u002Fi> Copilot · Perplexity<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<!-- ===================== STATS ===================== -->\n<section class=\"section-pad\" data-screen-label=\"Stats\">\n  <div class=\"wrap\">\n    <div class=\"stats-grid\">\n      <div class=\"stat reveal\" data-d=\"1\">\n        <div class=\"stat-num\"><span data-count=\"200\">0<\u002Fspan><span class=\"u\">+<\u002Fspan><\u002Fdiv>\n        <div class=\"stat-label\">Sensitive data patterns detected on-device<\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"stat reveal\" data-d=\"2\">\n        <div class=\"stat-num\">&lt;<span data-count=\"200\">0<\u002Fspan><span class=\"u\">ms<\u002Fspan><\u002Fdiv>\n        <div class=\"stat-label\">Local scan latency before submission<\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"stat reveal\" data-d=\"3\">\n        <div class=\"stat-num\"><span data-count=\"90\">0<\u002Fspan><span class=\"u\">%+<\u002Fspan><\u002Fdiv>\n        <div class=\"stat-label\">Detection accuracy on structured entities<\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"stat reveal\" data-d=\"4\">\n        <div class=\"stat-num\"><span data-count=\"3\">0<\u002Fspan><\u002Fdiv>\n        <div class=\"stat-label\">Access roles, from user to system admin<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ===================== PROBLEM ===================== -->\n<section class=\"problem section-pad\" id=\"problem\" data-screen-label=\"Problem\">\n  <div class=\"wrap problem-grid\">\n    <div class=\"reveal\">\n      <div class=\"eyebrow\">The problem<\u002Fdiv>\n      <h2>Your team is pasting <span class=\"hi\">secrets<\u002Fspan> into chatbots right now.<\u002Fh2>\n      <p class=\"problem-lead\">\n        Every day, employees paste <strong>passwords<\u002Fstrong>, <strong>national IDs<\u002Fstrong>, <strong>IBANs<\u002Fstrong>, <strong>API keys<\u002Fstrong>, and confidential business data straight into ChatGPT, Gemini, and Claude — without realising the risk.\n      <\u002Fp>\n      <p class=\"problem-lead\" style=\"margin-top:16px;\">\n        Existing security tools watch the network. They react <em>after the fact<\u002Fem>.\n      <\u002Fp>\n      <div class=\"problem-call\">\n        <i data-lucide=\"shield-check\"><\u002Fi>\n        <span>Hares AI acts at the source — before the prompt is ever submitted.<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"reveal\" data-d=\"2\">\n      <div class=\"leak-card\">\n        <div class=\"leak-row\"><span class=\"leak-ic red\"><i data-lucide=\"key-round\"><\u002Fi><\u002Fspan><span class=\"lk-name\">Password<\u002Fspan><span class=\"lk-tag\">caught<\u002Fspan><\u002Fdiv>\n        <div class=\"leak-row\"><span class=\"leak-ic red\"><i data-lucide=\"id-card\"><\u002Fi><\u002Fspan><span class=\"lk-name\">National ID<\u002Fspan><span class=\"lk-tag\">caught<\u002Fspan><\u002Fdiv>\n        <div class=\"leak-row\"><span class=\"leak-ic red\"><i data-lucide=\"landmark\"><\u002Fi><\u002Fspan><span class=\"lk-name\">IBAN / Bank details<\u002Fspan><span class=\"lk-tag\">caught<\u002Fspan><\u002Fdiv>\n        <div class=\"leak-row\"><span class=\"leak-ic red\"><i data-lucide=\"terminal\"><\u002Fi><\u002Fspan><span class=\"lk-name\">API keys &amp; tokens<\u002Fspan><span class=\"lk-tag\">caught<\u002Fspan><\u002Fdiv>\n        <div class=\"leak-row\"><span class=\"leak-ic red\"><i data-lucide=\"credit-card\"><\u002Fi><\u002Fspan><span class=\"lk-name\">Credit cards<\u002Fspan><span class=\"lk-tag\">caught<\u002Fspan><\u002Fdiv>\n        <div class=\"leak-row\"><span class=\"leak-ic red\"><i data-lucide=\"file-lock\"><\u002Fi><\u002Fspan><span class=\"lk-name\">Confidential business data<\u002Fspan><span class=\"lk-tag\">caught<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ===================== HOW IT WORKS ===================== -->\n<section class=\"section-pad\" id=\"how\" data-screen-label=\"How it works\">\n  <div class=\"wrap\">\n    <div class=\"section-head center reveal\">\n      <div class=\"eyebrow\">How it works<\u002Fdiv>\n      <h2 class=\"section-title\">Four stages, all before you hit send.<\u002Fh2>\n      <p class=\"section-lead\">From keystroke to verdict in well under half a second — the heavy lifting happens locally, and only masked text ever leaves the device.<\u002Fp>\n    <\u002Fdiv>\n\n    <div class=\"flow\">\n      <div class=\"flow-step span-4 reveal\" data-d=\"1\">\n        <div class=\"num\">01<\u002Fdiv>\n        <h3>Intercept the prompt<\u002Fh3>\n        <p>A content script captures the prompt text the instant you type it — before it reaches ChatGPT, Gemini, or Claude.<\u002Fp>\n        <span class=\"meta\"><i data-lucide=\"mouse-pointer-click\"><\u002Fi> Real-time capture<\u002Fspan>\n      <\u002Fdiv>\n      <div class=\"flow-step span-4 reveal\" data-d=\"2\">\n        <div class=\"fic\"><i data-lucide=\"scan-search\"><\u002Fi><\u002Fdiv>\n        <h3>Scan locally<\u002Fh3>\n        <p>200+ regex patterns run entirely on-device, classifying the prompt with no cloud dependency for the primary scan.<\u002Fp>\n        <span class=\"meta\"><i data-lucide=\"timer\"><\u002Fi> &lt; 200ms · on-device<\u002Fspan>\n      <\u002Fdiv>\n      <div class=\"flow-step span-4 reveal\" data-d=\"3\">\n        <div class=\"fic\"><i data-lucide=\"venetian-mask\"><\u002Fi><\u002Fdiv>\n        <h3>Mask &amp; verify<\u002Fh3>\n        <p>For ambiguous cases, detected content is masked and only the placeholder text is sent to the Gemini API as a fallback classifier.<\u002Fp>\n        <span class=\"meta\"><i data-lucide=\"timer\"><\u002Fi> &lt; 500ms total<\u002Fspan>\n      <\u002Fdiv>\n\n      <div class=\"flow-arrow reveal\"><i data-lucide=\"chevron-down\"><\u002Fi><\u002Fdiv>\n\n      <div class=\"flow-decision reveal\">\n        <h3><i data-lucide=\"git-fork\"><\u002Fi> Risk decision &amp; enforcement<\u002Fh3>\n        <p style=\"color:var(--muted);max-width:620px;\">Every prompt is resolved to one of four risk levels, each with an automatic action — then anonymized metadata is logged to Firebase. No prompt content is ever stored.<\u002Fp>\n        <div class=\"decision-row\">\n          <div class=\"risk-card high\" style=\"box-shadow:none;border-radius:14px;padding:18px;\">\n            <div class=\"risk-level\"><span class=\"ic\"><i data-lucide=\"octagon-x\"><\u002Fi><\u002Fspan> HIGH<\u002Fdiv>\n            <div class=\"risk-action\" style=\"margin-top:12px;display:inline-block;\">Block + alert<\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"risk-card med\" style=\"box-shadow:none;border-radius:14px;padding:18px;\">\n            <div class=\"risk-level\"><span class=\"ic\"><i data-lucide=\"alert-triangle\"><\u002Fi><\u002Fspan> MEDIUM<\u002Fdiv>\n            <div class=\"risk-action\" style=\"margin-top:12px;display:inline-block;\">Warn + choose<\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"risk-card low\" style=\"box-shadow:none;border-radius:14px;padding:18px;\">\n            <div class=\"risk-level\"><span class=\"ic\"><i data-lucide=\"info\"><\u002Fi><\u002Fspan> LOW<\u002Fdiv>\n            <div class=\"risk-action\" style=\"margin-top:12px;display:inline-block;\">Info banner<\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"risk-card none\" style=\"box-shadow:none;border-radius:14px;padding:18px;\">\n            <div class=\"risk-level\"><span class=\"ic\"><i data-lucide=\"check\"><\u002Fi><\u002Fspan> NONE<\u002Fdiv>\n            <div class=\"risk-action\" style=\"margin-top:12px;display:inline-block;\">Allow silently<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ===================== RISK LEVELS ===================== -->\n<section class=\"arch section-pad\" id=\"risk\" data-screen-label=\"Risk levels\">\n  <div class=\"wrap\">\n    <div class=\"section-head center reveal\">\n      <div class=\"eyebrow\">Risk classification<\u002Fdiv>\n      <h2 class=\"section-title\">One signal, four levels of response.<\u002Fh2>\n      <p class=\"section-lead\">Each prompt is mapped to a risk tier with example entities and an enforced action — no guesswork for the user.<\u002Fp>\n    <\u002Fdiv>\n    <div class=\"risk-grid\">\n      <div class=\"risk-card high reveal\" data-d=\"1\">\n        <div class=\"risk-top\">\n          <span class=\"risk-level\"><span class=\"ic\"><i data-lucide=\"octagon-x\"><\u002Fi><\u002Fspan> HIGH<\u002Fspan>\n          <span class=\"risk-action\">BLOCKED<\u002Fspan>\n        <\u002Fdiv>\n        <h3>Hard stop, no override<\u002Fh3>\n        <p class=\"risk-ents\">Saudi National ID, IBAN, Passport, API Key, Password, Credit Card.<\u002Fp>\n        <div class=\"risk-note\">Submission is blocked and the user is alerted instantly.<\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"risk-card med reveal\" data-d=\"2\">\n        <div class=\"risk-top\">\n          <span class=\"risk-level\"><span class=\"ic\"><i data-lucide=\"alert-triangle\"><\u002Fi><\u002Fspan> MEDIUM<\u002Fspan>\n          <span class=\"risk-action\">WARNING<\u002Fspan>\n        <\u002Fdiv>\n        <h3>Warn, user decides<\u002Fh3>\n        <p class=\"risk-ents\">Internal financial data, employee records, contract references.<\u002Fp>\n        <div class=\"risk-note\">A warning appears; the user makes an informed choice.<\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"risk-card low reveal\" data-d=\"3\">\n        <div class=\"risk-top\">\n          <span class=\"risk-level\"><span class=\"ic\"><i data-lucide=\"info\"><\u002Fi><\u002Fspan> LOW<\u002Fspan>\n          <span class=\"risk-action\">INFO<\u002Fspan>\n        <\u002Fdiv>\n        <h3>Non-blocking notice<\u002Fh3>\n        <p class=\"risk-ents\">Internal endpoints, codenames, generic internal references.<\u002Fp>\n        <div class=\"risk-note\">An info banner is shown — the prompt still goes through.<\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"risk-card none reveal\" data-d=\"4\">\n        <div class=\"risk-top\">\n          <span class=\"risk-level\"><span class=\"ic\"><i data-lucide=\"check\"><\u002Fi><\u002Fspan> NONE<\u002Fspan>\n          <span class=\"risk-action\">ALLOWED<\u002Fspan>\n        <\u002Fdiv>\n        <h3>Silent pass<\u002Fh3>\n        <p class=\"risk-ents\">No sensitive data found anywhere in the prompt.<\u002Fp>\n        <div class=\"risk-note\">The prompt is allowed through with zero friction.<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ===================== FEATURES ===================== -->\n<section class=\"section-pad\" id=\"features\" data-screen-label=\"Features\">\n  <div class=\"wrap\">\n    <div class=\"section-head center reveal\">\n      <div class=\"eyebrow\">Key features<\u002Fdiv>\n      <h2 class=\"section-title\">Everything a security team needs — and nothing the user has to think about.<\u002Fh2>\n    <\u002Fdiv>\n    <div class=\"feat-grid\">\n      <div class=\"feat reveal\" data-d=\"1\"><div class=\"feat-ic\"><i data-lucide=\"radar\"><\u002Fi><\u002Fdiv><h3>Real-time interception<\u002Fh3><p>Captures prompt text before it reaches ChatGPT, Gemini, or Claude.<\u002Fp><\u002Fdiv>\n      <div class=\"feat reveal\" data-d=\"2\"><div class=\"feat-ic\"><i data-lucide=\"cpu\"><\u002Fi><\u002Fdiv><h3>Local-first detection<\u002Fh3><p>200+ regex patterns run on-device — no cloud dependency for the primary scan.<\u002Fp><\u002Fdiv>\n      <div class=\"feat reveal\" data-d=\"3\"><div class=\"feat-ic\"><i data-lucide=\"sparkles\"><\u002Fi><\u002Fdiv><h3>AI fallback<\u002Fh3><p>Gemini API as a secondary classifier for ambiguous cases — masked text only.<\u002Fp><\u002Fdiv>\n      <div class=\"feat reveal\" data-d=\"4\"><div class=\"feat-ic\"><i data-lucide=\"gauge\"><\u002Fi><\u002Fdiv><h3>Risk classification<\u002Fh3><p>High / Medium / Low / None, with automatic enforcement per level.<\u002Fp><\u002Fdiv>\n      <div class=\"feat reveal\" data-d=\"1\"><div class=\"feat-ic\"><i data-lucide=\"wand-sparkles\"><\u002Fi><\u002Fdiv><h3>Prompt revision<\u002Fh3><p>AI-generated safe rewrite of any blocked prompt — ready to resubmit.<\u002Fp><\u002Fdiv>\n      <div class=\"feat reveal\" data-d=\"2\"><div class=\"feat-ic\"><i data-lucide=\"scroll-text\"><\u002Fi><\u002Fdiv><h3>Audit logs<\u002Fh3><p>Anonymized activity logs per user, per department, and org-wide.<\u002Fp><\u002Fdiv>\n      <div class=\"feat reveal\" data-d=\"3\"><div class=\"feat-ic\"><i data-lucide=\"users\"><\u002Fi><\u002Fdiv><h3>Role-based dashboard<\u002Fh3><p>Three roles: Normal User, Department Admin, and System Admin.<\u002Fp><\u002Fdiv>\n      <div class=\"feat reveal\" data-d=\"4\"><div class=\"feat-ic\"><i data-lucide=\"sliders-horizontal\"><\u002Fi><\u002Fdiv><h3>Configurable rules<\u002Fh3><p>System admins can add, edit, and disable detection patterns.<\u002Fp><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ===================== PLATFORMS ===================== -->\n<section class=\"arch section-pad\" data-screen-label=\"Platforms\">\n  <div class=\"wrap\">\n    <div class=\"section-head center reveal\">\n      <div class=\"eyebrow\">Supported platforms<\u002Fdiv>\n      <h2 class=\"section-title\">Works where your team already works.<\u002Fh2>\n    <\u002Fdiv>\n    <div class=\"plat-grid\">\n      <div class=\"plat reveal\" data-d=\"1\"><div class=\"plat-ic\"><i data-lucide=\"message-square\"><\u002Fi><\u002Fdiv><h4>ChatGPT<\u002Fh4><span class=\"status live\"><i data-lucide=\"check\"><\u002Fi> Supported<\u002Fspan><\u002Fdiv>\n      <div class=\"plat reveal\" data-d=\"2\"><div class=\"plat-ic\"><i data-lucide=\"sparkles\"><\u002Fi><\u002Fdiv><h4>Google Gemini<\u002Fh4><span class=\"status live\"><i data-lucide=\"check\"><\u002Fi> Supported<\u002Fspan><\u002Fdiv>\n      <div class=\"plat reveal\" data-d=\"3\"><div class=\"plat-ic\"><i data-lucide=\"bot\"><\u002Fi><\u002Fdiv><h4>Claude<\u002Fh4><span class=\"status live\"><i data-lucide=\"check\"><\u002Fi> Supported<\u002Fspan><\u002Fdiv>\n      <div class=\"plat reveal\" data-d=\"4\"><div class=\"plat-ic\"><i data-lucide=\"square-terminal\"><\u002Fi><\u002Fdiv><h4>MS Copilot<\u002Fh4><span class=\"status soon\"><i data-lucide=\"clock\"><\u002Fi> Planned<\u002Fspan><\u002Fdiv>\n      <div class=\"plat reveal\" data-d=\"4\"><div class=\"plat-ic\"><i data-lucide=\"search\"><\u002Fi><\u002Fdiv><h4>Perplexity<\u002Fh4><span class=\"status soon\"><i data-lucide=\"clock\"><\u002Fi> Planned<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ===================== ARCHITECTURE ===================== -->\n<section class=\"section-pad\" id=\"architecture\" data-screen-label=\"Architecture\">\n  <div class=\"wrap\">\n    <div class=\"section-head center reveal\">\n      <div class=\"eyebrow\">System architecture<\u002Fdiv>\n      <h2 class=\"section-title\">A clean four-layer stack.<\u002Fh2>\n      <p class=\"section-lead\">Presentation, logic, data access, and storage — cleanly separated, from the extension UI down to Firestore.<\u002Fp>\n    <\u002Fdiv>\n    <div class=\"arch-stack\">\n      <div class=\"arch-layer reveal\" data-d=\"1\">\n        <div class=\"lname\"><span class=\"ic\"><i data-lucide=\"monitor\"><\u002Fi><\u002Fspan><div><span class=\"lnum\">Layer 01<\u002Fspan><h4>Presentation<\u002Fh4><\u002Fdiv><\u002Fdiv>\n        <div class=\"arch-mods\"><span class=\"arch-mod\">Chrome Extension UI<\u002Fspan><span class=\"arch-mod\">React Web Dashboard<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"arch-conn reveal\"><i data-lucide=\"chevron-down\"><\u002Fi><\u002Fdiv>\n      <div class=\"arch-layer reveal\" data-d=\"1\">\n        <div class=\"lname\"><span class=\"ic\"><i data-lucide=\"cog\"><\u002Fi><\u002Fspan><div><span class=\"lnum\">Layer 02<\u002Fspan><h4>Business logic<\u002Fh4><\u002Fdiv><\u002Fdiv>\n        <div class=\"arch-mods\"><span class=\"arch-mod\">Content Script<\u002Fspan><span class=\"arch-mod\">Background Worker<\u002Fspan><span class=\"arch-mod\">Controllers<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"arch-conn reveal\"><i data-lucide=\"chevron-down\"><\u002Fi><\u002Fdiv>\n      <div class=\"arch-layer reveal\" data-d=\"1\">\n        <div class=\"lname\"><span class=\"ic\"><i data-lucide=\"plug\"><\u002Fi><\u002Fspan><div><span class=\"lnum\">Layer 03<\u002Fspan><h4>Data access<\u002Fh4><\u002Fdiv><\u002Fdiv>\n        <div class=\"arch-mods\"><span class=\"arch-mod\">Firebase SDK<\u002Fspan><span class=\"arch-mod\">Chrome Storage API<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"arch-conn reveal\"><i data-lucide=\"chevron-down\"><\u002Fi><\u002Fdiv>\n      <div class=\"arch-layer reveal\" data-d=\"1\">\n        <div class=\"lname\"><span class=\"ic\"><i data-lucide=\"database\"><\u002Fi><\u002Fspan><div><span class=\"lnum\">Layer 04<\u002Fspan><h4>Data<\u002Fh4><\u002Fdiv><\u002Fdiv>\n        <div class=\"arch-mods\"><span class=\"arch-mod\">Firestore Database<\u002Fspan><span class=\"arch-mod\">Chrome Local Storage<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ===================== SECURITY ===================== -->\n<section class=\"section-pad\" id=\"security\" data-screen-label=\"Security\">\n  <div class=\"wrap\">\n    <div class=\"section-head reveal\">\n      <div class=\"eyebrow\">Privacy &amp; security<\u002Fdiv>\n      <h2 class=\"section-title\">Built so raw secrets never have to leave the device.<\u002Fh2>\n    <\u002Fdiv>\n    <div class=\"sec-grid\">\n      <div class=\"sec-quote reveal\">\n        <div class=\"lock\"><i data-lucide=\"lock-keyhole\"><\u002Fi><\u002Fdiv>\n        <blockquote>“No raw sensitive data is ever stored or transmitted.”<\u002Fblockquote>\n        <div class=\"src\">// core design guarantee<\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"sec-list reveal\" data-d=\"1\">\n        <div class=\"sec-item\"><span class=\"ck\"><i data-lucide=\"check\"><\u002Fi><\u002Fspan><p>All primary detection runs <strong>locally on the user's device<\u002Fstrong>.<\u002Fp><\u002Fdiv>\n        <div class=\"sec-item\"><span class=\"ck\"><i data-lucide=\"check\"><\u002Fi><\u002Fspan><p>Only <strong>masked text<\u002Fstrong> with placeholder tags is sent to the Gemini API when needed.<\u002Fp><\u002Fdiv>\n        <div class=\"sec-item\"><span class=\"ck\"><i data-lucide=\"check\"><\u002Fi><\u002Fspan><p>Logs store <strong>anonymized metadata only<\u002Fstrong> — never prompt content.<\u002Fp><\u002Fdiv>\n        <div class=\"sec-item\"><span class=\"ck\"><i data-lucide=\"check\"><\u002Fi><\u002Fspan><p>Gemini runs under the <strong>Google Cloud DPA<\u002Fstrong> — inputs are never used to train Google's models.<\u002Fp><\u002Fdiv>\n        <div class=\"sec-item\"><span class=\"ck\"><i data-lucide=\"check\"><\u002Fi><\u002Fspan><p><strong>HTTPS-only<\u002Fstrong> communication across the board.<\u002Fp><\u002Fdiv>\n        <div class=\"sec-item\"><span class=\"ck\"><i data-lucide=\"check\"><\u002Fi><\u002Fspan><p><strong>Role-based access control<\u002Fstrong> (RBAC) at every dashboard tier.<\u002Fp><\u002Fdiv>\n        <div class=\"sec-item\"><span class=\"ck\"><i data-lucide=\"check\"><\u002Fi><\u002Fspan><p><strong>bcrypt<\u002Fstrong> password hashing for all credentials.<\u002Fp><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ===================== TECH STACK ===================== -->\n<section class=\"arch section-pad\" id=\"tech\" data-screen-label=\"Tech stack\">\n  <div class=\"wrap\">\n    <div class=\"section-head center reveal\">\n      <div class=\"eyebrow\">Tech stack<\u002Fdiv>\n      <h2 class=\"section-title\">Modern, lean, and proven.<\u002Fh2>\n    <\u002Fdiv>\n    <div class=\"tech-grid\">\n      <div class=\"tech reveal\" data-d=\"1\"><span class=\"ic\"><i data-lucide=\"chrome\"><\u002Fi><\u002Fspan><div><div class=\"tlabel\">Browser extension<\u002Fdiv><div class=\"tval\">Chrome Manifest V3<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n      <div class=\"tech reveal\" data-d=\"2\"><span class=\"ic\"><i data-lucide=\"atom\"><\u002Fi><\u002Fspan><div><div class=\"tlabel\">Frontend dashboard<\u002Fdiv><div class=\"tval\">React (JSX)<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n      <div class=\"tech reveal\" data-d=\"3\"><span class=\"ic\"><i data-lucide=\"key-round\"><\u002Fi><\u002Fspan><div><div class=\"tlabel\">Authentication<\u002Fdiv><div class=\"tval\">Firebase Auth<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n      <div class=\"tech reveal\" data-d=\"1\"><span class=\"ic\"><i data-lucide=\"database\"><\u002Fi><\u002Fspan><div><div class=\"tlabel\">Database<\u002Fdiv><div class=\"tval\">Firebase Firestore<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n      <div class=\"tech reveal\" data-d=\"2\"><span class=\"ic\"><i data-lucide=\"scan-search\"><\u002Fi><\u002Fspan><div><div class=\"tlabel\">AI detection<\u002Fdiv><div class=\"tval\">Regex + Gemini API<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n      <div class=\"tech reveal\" data-d=\"3\"><span class=\"ic\"><i data-lucide=\"hard-drive\"><\u002Fi><\u002Fspan><div><div class=\"tlabel\">Local storage<\u002Fdiv><div class=\"tval\">Chrome Storage API<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ===================== ROLES ===================== -->\n<section class=\"section-pad\" id=\"roles\" data-screen-label=\"Roles\
