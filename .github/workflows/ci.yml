name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r control_plane/requirements.txt
          pip install pytest bandit flake8

      - name: Python Security Scan (Bandit)
        run: bandit -r control_plane/app -ll

      - name: Python Linting (Flake8)
        run: flake8 control_plane/app --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Run Backend Tests
        env:
          DATABASE_URL: sqlite:///./test.db
          REDIS_URL: redis://localhost:6379
        run: |
          export PYTHONPATH=$PYTHONPATH:$(pwd)
          pytest control_plane

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Interception Layer Syntax Check
        run: |
          # Basic check for JS syntax errors using node
          find interception_layer -name "*.js" -exec node -c {} \;
