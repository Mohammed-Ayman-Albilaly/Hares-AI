<!DOCTYPE html>
<html>
<head>
    <title>Hares AI Auth</title>
    <style>
        body { width: 300px; padding: 15px; font-family: sans-serif; }
        .form-group { margin-bottom: 10px; }
        input { width: 100%; padding: 8px; box-sizing: border-box; }
        button { width: 100%; padding: 10px; cursor: pointer; background: #007bff; color: white; border: none; border-radius: 4px; }
        .hidden { display: none; }
        .status { margin-top: 10px; padding: 10px; background: #f0f0f0; border-radius: 4px; font-size: 0.9em; }
    </style>
</head>
<body>
    <div id="login-section">
        <h3>Hares AI Login</h3>
        <div class="form-group">
            <input type="email" id="email" placeholder="Email" required>
        </div>
        <div class="form-group">
            <input type="password" id="password" placeholder="Password" required>
        </div>
        <button id="login-btn">Login</button>
    </div>

    <div id="user-section" class="hidden">
        <h3>Welcome to Hares AI</h3>
        <div class="status" id="user-info">Checking identity...</div>
        <button id="logout-btn" style="background: #dc3545; margin-top: 10px;">Logout</button>
    </div>

    <script src="popup.js"></script>
</body>
</html>
